

services:
  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --workers=3 bus.wsgi
    ports:
      - "8000:8000"  
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
    depends_on:
      - db
    networks:
      - app_network
    
    

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: aagam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network

volumes:
  pgdata:


networks:
  app_network:  
    driver: bridge
